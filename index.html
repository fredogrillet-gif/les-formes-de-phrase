<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les formes de phrases – Le Labo des Savoirs</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#111827;font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;color:#1f2937}
#st{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#sl{width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#fff;position:relative;font-size:min(1.9vw,3.4vh);display:flex;flex-direction:column;overflow:hidden}
.hd{background:var(--c);color:#fff;padding:.5em 1.2em;font-weight:700;display:flex;justify-content:space-between;font-size:.8em}
.hd span{background:rgba(255,255,255,.22);border-radius:1em;padding:0 .8em}
h1{color:var(--c);font-size:1.6em;padding:.6em 1em .2em}
.bd{flex:1;padding:.3em 1.4em;overflow:hidden}
.ft{display:flex;justify-content:space-between;align-items:center;font-size:.6em;color:#64748b;padding:.4em 1.6em;border-top:1px solid #e2e8f0}
.ft img{height:3.6em}
.ph{background:#f1f5f9;border-left:.3em solid var(--c);padding:.35em .8em;margin:.35em 0;font-size:1.15em;border-radius:.3em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.2em}
p{margin:.4em 0;line-height:1.35}
ul{margin:.3em 0 .3em 1.2em}li{margin:.25em 0;line-height:1.3}
table{border-collapse:collapse;width:100%;margin:.4em 0;font-size:.95em}
th{background:var(--c);color:#fff;padding:.3em .6em;text-align:left}
td{border:1px solid #cbd5e1;padding:.3em .6em}
b.n{color:#dc2626;text-decoration:underline wavy #dc2626 .08em;text-underline-offset:.2em}
.f{opacity:0;transition:opacity .35s}.f.on{opacity:1}
.ok{color:#059669;font-weight:700}.ko{color:#dc2626}
.box{border:.18em dashed var(--c);border-radius:.5em;padding:.4em .9em;margin:.5em 0;background:#fffbeb}
.q .bd{border-left:.5em solid #f59e0b}.a .bd{border-left:.5em solid #10b981}.r .bd{background:#f0fdf4}
.big{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;height:100%;gap:.3em}
.big h2{font-size:2.6em;color:var(--c)}.big p{font-size:1.2em}
.s{background:linear-gradient(135deg,#fff,#f1f5f9)}
#nav{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;opacity:.15;transition:.2s;z-index:5}
#nav:hover{opacity:1}
#nav button,#tm button{border:0;border-radius:.4em;padding:5px 10px;font-weight:700;cursor:pointer;color:#fff;background:#475569}
#tm{position:fixed;top:10px;right:10px;background:#0f172aee;color:#fff;border-radius:.6em;padding:10px;display:none;z-index:6;text-align:center}
#tm div{font-size:42px;font-weight:700;margin-bottom:6px}
#bar{position:absolute;bottom:0;left:0;height:.3em;background:var(--c);transition:width .3s}
</style>
</head>

S(0,'Les formes de phrases','Affirmative · négative · exclamative<br>Séquence de 5 séances · CM1-CM2<br><small>Professeur Frédéric — Le Labo des Savoirs / Heckel sans Jeckel</small>'),
C(0,'Comment on travaille','<ul><li>❓ Une diapo <b>question</b> (bandeau orange) : tu cherches sur ton <b>ardoise</b> ou ton brouillon.</li><li>On échange vos <b>hypothèses</b> : il n’y a pas de mauvaise idée, mais il faut <b>justifier</b>.</li><li>✅ La <b>réponse</b> arrive toujours sur la diapo suivante (bandeau vert).</li><li>📌 À la fin de chaque séance, on construit ensemble « Je retiens ».</li></ul>'+F('<div class=box>Tu es un <b>détective de la grammaire</b> : tu observes, tu compares, tu découvres la règle !</div>')),
C(0,'Notre séquence','<p>'+T(['Séance','Ce qu’on découvre','Notre défi'],[['1','Affirmative / négative','Le jeu du détective'],['2','Transformer en phrase négative','La machine à transformer'],['3','pas · plus · jamais · rien · personne · que','L’enquête sur le sens'],['4','Exclamative / non exclamative + combinaison','Le laboratoire des émotions'],['5','Réinvestir et construire la trace écrite','Le maître du tri']],1)+'</p>'),

S(1,'« Oui ou non ? »','Découvrir les formes affirmative et négative'),
Q(1,'Deux phrases, une situation ?',P('Léo mange des épinards.','Léo ne mange pas d’épinards.')+'<p>Ces deux phrases parlent-elles de la même situation ? <b>Qu’est-ce qui a changé ?</b></p><p>Écris ta réponse sur ton ardoise.</p>'),
A(1,'Ce qu’on a observé',P('Léo mange des épinards. → on dit que Léo <b>mange</b>.','Léo [[ne]] mange [[pas]] d’épinards. → on dit qu’il <b>ne mange pas</b>.')+F('<p>On a ajouté <b>ne … pas</b> autour du verbe.</p>')+F('<div class=box>Comment pourrait-on <b>classer</b> ces deux phrases ? On dit qu’une phrase est <b>affirmative</b> ou <b>négative</b>.</div>')),
Q(1,'À vos groupes : le tri !','<p>Voici 8 phrases. <b>Regroupez celles qui fonctionnent de la même manière</b> et expliquez ce qui vous permet de les regrouper.</p><div class=g2><div>'+P('Le chat ne dort pas.','Nous allons à la piscine.','Emma connaît la réponse.','Les enfants ne jouent pas dehors.')+'</div><div>'+P('Nous n’allons pas à la piscine.','Le chat dort.','Les enfants jouent dehors.','Emma ne connaît pas la réponse.')+'</div></div><p>⏱ 10 minutes · Chaque groupe prépare une explication.</p>'),
A(1,'Mise en commun',T(['Groupe 1 : affirmative','Groupe 2 : négative'],[['Le chat dort.','Le chat [[ne]] dort [[pas]].'],['Nous allons à la piscine.','Nous [[n’]]allons [[pas]] à la piscine.'],['Emma connaît la réponse.','Emma [[ne]] connaît [[pas]] la réponse.']],1)+F('<div class=box>Une phrase <b>affirmative</b> affirme quelque chose.<br>Une phrase <b>négative</b> nie quelque chose : elle contient <b>ne … pas</b>.</div>')),
Q(1,'Petit défi : transforme !','<p>Transforme chaque phrase en phrase <b>négative</b>.</p>'+P('Le chien aboie.','Ils regardent un film.','Paul a terminé son travail.','Elle aime les fraises.')+'<p>Qu’est-ce qui a changé dans chaque phrase ?</p>'),
A(1,'Les phrases négatives',P('Le chien [[ne]] aboie [[pas]].','Ils [[ne]] regardent [[pas]] un film.','Paul [[n’]]a [[pas]] terminé son travail.','Elle [[n’]]aime [[pas]] les fraises.')+F('<div class=box>Le verbe est <b>encadré</b> par deux mots de négation.<br>Devant une voyelle, <b>ne</b> devient <b>n’</b> (élision).</div>')),
Q(1,'Pour un élève absent…','<div class=box style="font-size:1.2em">Si tu devais expliquer à un élève absent <b>comment reconnaître une phrase négative</b>, que lui dirais-tu ?</div><p>Écris 1 ou 2 phrases sur ton ardoise. On construit la règle ensemble.</p>'),
R(1,'Je retiens (séance 1)','<ul><li>Une phrase <b>affirmative</b> affirme quelque chose.</li><li>Une phrase <b>négative</b> nie quelque chose.</li><li>Pour former une phrase négative, on utilise généralement <b>deux mots</b> qui encadrent le verbe : <b>ne … pas</b>.</li></ul>'+P('Il mange. → Il [[ne]] mange [[pas]].')),

S(2,'« La machine à transformer »','Bien construire la négation, y compris avec les verbes composés'),
Q(2,'Même consigne, deux phrases','<p>Écris le <b>contraire</b> de chaque phrase :</p>'+P('Léa mange une pomme.','Léa a mangé une pomme.')+'<p>Compare tes deux réponses.</p>'),
A(2,'Comparons',P('Léa [[ne]] mange [[pas]] une pomme.','Léa [[n’]]a [[pas]] mangé une pomme.')),
Q(2,'Une question de place',P('Léa n’a pas mangé une pomme.','❌ Léa n’a mangé pas une pomme.')+'<p>Pourquoi écrit-on « n’a pas mangé » et pas « n’a mangé pas » ?</p><p>Cherche une explication sur ton ardoise.</p>'),
A(2,'Pourquoi « n’a pas mangé » ?','<p>Dans « Léa a mangé », le verbe est <b>composé</b> : il y a un auxiliaire (<b>a</b>) et un participe passé (<b>mangé</b>).</p>'+F('<div class=box>La négation encadre le <b>verbe conjugué</b>, donc l’<b>auxiliaire</b> :<br>Léa [[n’]]<b>a</b> [[pas]] mangé.</div>')+F('<p>Un verbe conjugué se repère : c’est celui qui change avec le sujet (je mange, tu manges…).</p>')),
Q(2,'Atelier : déplace les étiquettes','<p>Avec ces étiquettes, <b>fabrique la phrase négative</b> :</p><div class=ph style="text-align:center">Léo — a — mangé — son goûter</div><div class=ph style="text-align:center">ne — pas</div><p>Puis transforme sur ton ardoise :</p>'+P('Elle regarde la télévision.','Elle a regardé la télévision.','Ils sont partis.','Nous avons terminé.')),
A(2,'Les phrases négatives',P('Léo [[n’]]a [[pas]] mangé son goûter.','Elle [[ne]] regarde [[pas]] la télévision.','Elle [[n’]]a [[pas]] regardé la télévision.','Ils [[ne]] sont [[pas]] partis.','Nous [[n’]]avons [[pas]] terminé.')+F('<div class=box>Avec un verbe composé, la négation encadre l’<b>auxiliaire</b>.</div>')),
Q(2,'Vous êtes les correcteurs !','<p>Dans un manuel de grammaire, ces phrases contiennent des erreurs. <b>Trouvez-les, corrigez-les et expliquez.</b></p>'+P('❌ Il n’aime le chocolat pas.','❌ Il a pas mangé.','❌ Elle ne est pas venue.','❌ Il ne regarde jamais pas la télévision.')),
A(2,'Corrections',T(['Phrase fausse','Phrase correcte','Explication'],[['Il n’aime le chocolat pas.','Il [[n’]]aime [[pas]] le chocolat.','Le 2e mot suit le verbe'],['Il a pas mangé.','Il [[n’]]a [[pas]] mangé.','Le « ne » est obligatoire à l’écrit'],['Elle ne est pas venue.','Elle [[n’]]est [[pas]] venue.','Élision devant une voyelle'],['Il ne regarde jamais pas la télévision.','Il [[ne]] regarde [[jamais]] la télévision.','Une seule marque de négation ici']],1)),
R(2,'Je retiens (séance 2)','<ul><li>On encadre le <b>verbe conjugué</b> avec les deux mots de négation.</li><li>Verbe composé : on encadre l’<b>auxiliaire</b> → Il n’<b>a</b> pas mangé.</li><li>Devant une voyelle : <b>ne → n’</b>.</li><li>À l’écrit, le <b>« ne »</b> est obligatoire.</li></ul>'),

S(3,'« Pas, plus, jamais, rien, personne, que… »','L’enquête sur le sens des marques de négation'),
Q(3,'Même sens ?',P('Je ne mange pas de viande.','Je ne mange plus de viande.','Je ne mange jamais de viande.')+'<p>Ces trois phrases veulent-elles <b>exactement</b> dire la même chose ? Explique les différences.</p>'),
A(3,'Trois sens différents',T(['Marque','Sens'],[['ne … <b>pas</b>','négation simple'],['ne … <b>plus</b>','avant oui, maintenant non (un changement)'],['ne … <b>jamais</b>','à aucun moment (une habitude)']],1)),
Q(3,'L’enquête des détectives','<p>Pour chaque situation, trouve <b>la marque de négation</b> et invente un exemple.</p><table><tr><th>N°</th><th>Tu veux dire…</th></tr><tr><td>1</td><td>une personne ne mange aucune chose</td></tr><tr><td>2</td><td>une personne ne rencontre aucune personne</td></tr><tr><td>3</td><td>une activité s’est arrêtée</td></tr><tr><td>4</td><td>une chose ne se produit à aucun moment</td></tr><tr><td>5</td><td>tu veux simplement nier quelque chose</td></tr><tr><td>6</td><td>tu veux dire « seulement »</td></tr></table>'),
A(3,'Résultats de l’enquête',T(['N°','Marque','Exemple'],[['1','ne … rien','Il [[ne]] mange [[rien]].'],['2','ne … personne','Il [[ne]] rencontre [[personne]].'],['3','ne … plus','Il [[ne]] joue [[plus]].'],['4','ne … jamais','Il [[ne]] ment [[jamais]].'],['5','ne … pas','Il [[ne]] mange [[pas]].'],['6','ne … que','Il [[ne]] mange [[que]] des légumes.']],1)),
Q(3,'Un cas particulier',P('Il ne mange que des légumes.')+'<p>Est-ce qu’il ne mange <b>aucun</b> légume ?</p><p>Alors pourquoi y a-t-il un « ne » ?</p>'),
A(3,'« ne … que » = « seulement »','<p>Non : il mange <b>des légumes, et rien d’autre</b> !</p>'+P('Il ne mange que des légumes. = Il mange <b>seulement</b> des légumes.','Il ne reste que deux places. = Il reste <b>seulement</b> deux places.')+F('<div class=box>« ne … que » exprime une <b>restriction</b>, pas une négation totale.</div>')),
Q(3,'Défi : quelle négation choisir ?','<p>Complète avec la bonne marque et <b>explique ton choix</b> (la justification compte plus que la réponse).</p>'+P('1. Je ___ mange ___ de viande. <small>(à aucun moment)</small>','2. Je ___ mange ___ de viande. <small>(avant oui, maintenant non)</small>','3. Je ___ vois ___ dans le brouillard. <small>(aucune chose)</small>','4. Il ___ connaît ___ dans cette classe. <small>(aucune personne)</small>','5. Il ___ reste ___ trois gâteaux. <small>(seulement)</small>')),
A(3,'Corrigé',P('1. Je [[ne]] mange [[jamais]] de viande.','2. Je [[ne]] mange [[plus]] de viande.','3. Je [[ne]] vois [[rien]] dans le brouillard.','4. Il [[ne]] connaît [[personne]] dans cette classe.','5. Il [[ne]] reste [[que]] trois gâteaux.')+F('<div class=box>💪 Défi CM2 : on peut <b>combiner</b> deux marques : « Il ne dit <b>jamais rien</b>. » (et non « rien jamais »)</div>')),
R(3,'Je retiens (séance 3)','<ul><li>Chaque marque a un <b>sens précis</b> : <b>pas · plus · jamais · rien · personne · que</b>.</li><li>Je me demande d’abord <b>ce que je veux dire</b>, puis je choisis la marque.</li><li>« ne … que » = <b>seulement</b> (restriction).</li><li>On peut en combiner deux : Il ne dit jamais rien.</li></ul>'),

S(4,'« Une phrase peut-elle avoir deux formes ? »','Exclamative ou non exclamative, et combinaison avec la négation'),
Q(4,'Combien de différences ?',P('Léo aime les épinards.','Léo n’aime pas les épinards.','Léo aime les épinards !','Léo n’aime pas les épinards !')+'<p>Observe ces 4 phrases : <b>combien de différences</b> trouves-tu ? Lesquelles ?</p>'),
A(4,'Deux différences, quatre phrases','<ul><li>présence ou absence de la <b>négation</b> (ne … pas)</li><li>présence ou absence du <b>point d’exclamation</b> (émotion forte)</li></ul>'+F(T(['','Pas d’émotion forte','Émotion forte'],[['<b>Affirmative</b>','Léo aime les épinards.','Léo aime les épinards !'],['<b>Négative</b>','Léo [[n’]]aime [[pas]] les épinards.','Léo [[n’]]aime [[pas]] les épinards !']]))),
Q(4,'Question essentielle','<div class=box style="font-size:1.3em;text-align:center;margin-top:1.5em">Une phrase peut-elle être <b>à la fois négative et exclamative</b> ?</div><p>Lève ton ardoise : OUI ou NON, et prépare un argument.</p>'),
A(4,'Oui, les formes sont indépendantes','<p class=ok>OUI ! « Léo n’aime pas les épinards ! » est <b>négative ET exclamative</b>.</p>'+F('<div class=box>Une phrase <b>exclamative</b> exprime une émotion forte (joie, surprise, colère…). On la reconnaît au <b>point d’exclamation</b>, parfois à <i>comme, quel, que</i>.<br>Les deux formes <b>se combinent librement</b>.</div>')+F('<p>⚠ Cela s’ajoute au type de phrase (déclarative, interrogative, injonctive), sans le remplacer.</p>')),
Q(4,'Le laboratoire des émotions','<p>Pour <b>chaque phrase neutre</b>, fabrique 4 versions : affirmative non exclamative · affirmative exclamative · négative non exclamative · négative exclamative.</p>'+P('Il y a encore du gâteau.','Tu as gagné.','Il fait chaud.','Nous avons réussi.','Il reste une place.')),
A(4,'Exemple de réponse',T(['Forme','Phrase'],[['Affirmative · non exclamative','Il y a encore du gâteau.'],['Négative · non exclamative','Il [[n’]]y a [[plus]] de gâteau.'],['Affirmative · exclamative','Il y a encore du gâteau !'],['Négative · exclamative','Il [[n’]]y a [[plus]] de gâteau !']],1)+F('<p>👉 Compare avec tes propres phrases : « Tu n’as pas gagné ! », « Nous n’avons rien réussi ! »… Plusieurs réponses sont possibles.</p>')),
R(4,'Je retiens (séance 4)','<ul><li>Une phrase est <b>affirmative</b> ou <b>négative</b>.</li><li>Elle est aussi <b>exclamative</b> (émotion forte, point d’exclamation) ou <b>non exclamative</b>.</li><li>Les deux formes sont <b>indépendantes</b> : on peut les combiner.</li></ul><div class=box>Je cherche <b>d’abord la négation</b>. Puis je cherche <b>si la phrase est exclamative</b>.</div>'),

S(5,'Défis : « Le maître du tri »','Réinvestir, justifier, construire la trace écrite'),
Q(5,'Défi 1 : classer et justifier','<p>Pour chaque phrase, dis si elle est <b>affirmative / négative</b> et <b>exclamative / non exclamative</b>. Justifie.</p>'+P('1. Je regarde un film.','2. Je ne regarde pas de film.','3. Quel beau film !','4. Je ne regarderai jamais ce film !','5. Il ne reste que deux places.','6. Comme cette histoire est drôle !')),
A(5,'Corrigé du défi 1',T(['Phrase','Aff. / nég.','Excl. / non excl.'],[['1','Affirmative','Non exclamative'],['2','Négative (ne … pas)','Non exclamative'],['3','Affirmative','Exclamative (« quel » + !)'],['4','Négative (ne … jamais)','Exclamative'],['5','Négative (ne … que = seulement)','Non exclamative'],['6','Affirmative','Exclamative (« comme » + !)']],1)),
Q(5,'Défi 2 : le détecteur d’erreurs','<p>Par deux : <b>corrigez et expliquez</b>.</p>'+P('❌ Il aime pas les épinards.','❌ Elle ne regarde la télévision pas.','❌ Il ne a plus faim.','❌ Il ne mange rien jamais.','❌ Il ne reste pas que deux places.')),
A(5,'Corrigé du défi 2',T(['Correction','Explication'],[['Il [[n’]]aime [[pas]] les épinards.','« ne » obligatoire à l’écrit'],['Elle [[ne]] regarde [[pas]] la télévision.','2e mot après le verbe'],['Il [[n’]]a [[plus]] faim.','élision ne → n’'],['Il [[ne]] mange [[jamais rien]].','ordre : jamais rien'],['Il [[ne]] reste [[que]] deux places.','« ne … que » = seulement, pas de « pas »']],1)),
Q(5,'Défi 3 : le créateur','<p>Point de départ : <b>Le chien joue dans le jardin.</b></p><div class=g2><div class=ph>🟢 affirmative · non exclamative<br>🔵 négative · non exclamative</div><div class=ph>🟠 affirmative · exclamative<br>🔴 négative · exclamative</div></div><p>Puis invente une phrase avec : <b>ne … jamais · plus · rien · personne · que</b>.</p>'),
A(5,'Exemples possibles',T(['Forme','Phrase'],[['🟢','Le chien joue dans le jardin.'],['🔵','Le chien [[ne]] joue [[pas]] dans le jardin.'],['🟠','Le chien joue dans le jardin !'],['🔴','Le chien [[ne]] joue [[pas]] dans le jardin !']],1)+F('<p>Le chien [[ne]] joue [[jamais]] dehors. · Il [[ne]] joue [[plus]]. · Il [[ne]] voit [[rien]]. · Il [[n’]]y a [[personne]] dans le jardin. · Il [[ne]] mange [[que]] des croquettes.</p>')),
Q(5,'Quelle trace écrite ?','<div class=box style="font-size:1.2em">À toi de proposer : <b>qu’est-ce qu’il faut retenir</b> sur les formes de phrases ?</div><p>Écris sur ton ardoise 3 idées essentielles. On construit ensuite la version définitive.</p>'),
R(5,'Je retiens (1/2) : affirmative / négative','<ul><li>Une phrase affirmative <b>affirme</b> quelque chose ; une phrase négative <b>nie</b> quelque chose.</li><li>La négation encadre le verbe conjugué : <b>ne … pas / plus / jamais / rien / personne / que</b>.</li></ul>'+P('Il mange. → Il [[ne]] mange [[pas]].')+'<p>« ne … que » = seulement. Verbe composé : on encadre l’auxiliaire.</p>'),
R(5,'Je retiens (2/2) : exclamative et combinaison','<p>Une phrase exclamative exprime une <b>émotion forte</b> (surprise, joie, colère, admiration…) et se termine par <b>!</b></p>'+T(['Phrase','Forme'],[['Il mange.','affirmative, non exclamative'],['Il ne mange pas.','négative, non exclamative'],['Il mange !','affirmative, exclamative'],['Il ne mange pas !','négative, exclamative']])+'<div class=box>Je cherche <b>d’abord la négation</b>. Puis je cherche <b>si la phrase est exclamative</b>. → Deux réponses pour une même phrase !</div>'),
S(0,'Bravo, détectives ! 🎉','Les formes de phrases n’ont plus de secret pour vous.')
];
const sl=$=>document.getElementById($);let i=0,S0=[];
SL.forEach((x,n)=>{if(x.k=='s'&&x.s)S0[x.s]=n});
function md(h){return h.replace(/\[\[(.+?)\]\]/g,'<b class=n>$1</b>')}
function show(n,full){
 i=Math.max(0,Math.min(SL.length-1,n));const x=SL[i],e=sl('sl');
 e.style.setProperty('--c',COL[x.s]);e.className=x.k;
 const bg={q:'❓ À toi de chercher · ardoise · réponse à la diapo suivante',a:'✅ Réponse',r:'📌 Je retiens'}[x.k]||'';
 const body=x.k=='s'?`<div class="big">${!x.s&&LOGO?`<img src="${LOGO}" style="height:40%">`:''}<h2>${x.s?'Séance '+x.s+'<br>':''}${x.t}</h2><p>${x.h}</p></div>`:`<h1>${x.t}</h1><div class=bd>${md(x.h)}</div>`;
 e.innerHTML=(x.k=='s'?'':`<div class=hd>${LAB[x.s]}<span>${bg}</span></div>`)+body+`<div class=ft><span>LE LABO DES SAVOIRS • Grammaire CM1-CM2</span>${LOGO?`<img src="${LOGO}">`:''}<span>${i+1} / ${SL.length}</span></div><div id=bar style="width:${(i+1)/SL.length*100}%"></div>`;
 if(full)e.querySelectorAll('.f').forEach(f=>f.classList.add('on'));
 history.replaceState(null,'','#'+(i+1));
}
function next(){const f=document.querySelector('#sl .f:not(.on)');f?f.classList.add('on'):show(i+1)}
function prev(){const o=document.querySelectorAll('#sl .f.on');o.length?o[o.length-1].classList.remove('on'):show(i-1,true)}
document.addEventListener('keydown',e=>{const k=e.key;
 if([' ','ArrowRight','ArrowDown','PageDown','Enter'].includes(k)){e.preventDefault();next()}
 else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
 else if(k=='Home')show(0);else if(k=='End')show(SL.length-1);
 else if(/^[1-5]$/.test(k))show(S0[+k]);else if(k=='f'||k=='F')fs();else if(k=='t'||k=='T')tg()});
sl('st').addEventListener('click',e=>{e.clientX<innerWidth/4?prev():next()});
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
const nv=sl('nav');nv.innerHTML='<button>⏮</button>'+[1,2,3,4,5].map(n=>`<button style="background:${COL[n]}">S${n}</button>`).join('')+'<button>⏱</button><button>⛶</button>';
nv.onclick=e=>{e.stopPropagation();const b=e.target.textContent;if(b=='⏮')show(0);else if(b[0]=='S')show(S0[+b[1]]);else if(b=='⏱')tg();else if(b=='⛶')fs()};
let tI,tL=0;const tm=sl('tm');tm.onclick=e=>e.stopPropagation();
function tg(){tm.style.display=tm.style.display=='block'?'none':'block'}
function pr(){const m=String(Math.floor(tL/60)).padStart(2,'0'),s=String(tL%60).padStart(2,'0');sl('td').textContent=m+':'+s}
tm.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{clearInterval(tI);tL=+b.dataset.m*60;pr();tI=setInterval(()=>{tL--;pr();if(tL<=0){clearInterval(tI);try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.8)}catch(x){}}},1000)});
sl('tx').onclick=()=>{clearInterval(tI);tg()};
show((parseInt(location.hash.slice(1))||1)-1,true);
</script>
</body>
</html>
